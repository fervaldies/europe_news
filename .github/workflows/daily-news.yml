name: Daily Europe News

on:
  schedule:
    - cron: '0 5 * * *'  # 5:00 UTC — runs 4h before EN posting at 9:00 UTC
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Get day name
        id: day
        run: echo "DAY_NAME=$(date +%A)" >> $GITHUB_OUTPUT

      - name: Fetch and create Europe news files
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_news.py "${{ steps.day.outputs.DAY_NAME }}"

      - name: Commit and push files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "*NewsEN.yml" "*NewsES.yml"
          git diff --staged --quiet || git commit -m "Europe news update: ${{ steps.day.outputs.DAY_NAME }}"
          git push
